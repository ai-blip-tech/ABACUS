name: Diagnose Ono production finance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DIAGNOSE_ONO_FINANCE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: roomdesign-production-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only Ono finance diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-backup
    steps:
      - name: Validate manual confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "DIAGNOSE_ONO_FINANCE"

      - name: Inspect recent Ono financial rows without changing production
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            cd "$HOME/ABACUS"
            test -f .env
            data_dir="$(sed -n 's/^ROOM_DESIGN_DATA_DIR=//p' .env | tail -n 1 | sed "s/^['\"]//;s/['\"]$//")"
            if [ -z "$data_dir" ]; then data_dir="$HOME/ABACUS/data"; fi
            test -d "$data_dir"
            test -f "$data_dir/room-design.sqlite"

            echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
            echo "SITE_HEALTH=$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null && echo ok)"
            python3 - "$data_dir/room-design.sqlite" <<'PY'
            import sqlite3
            import sys

            database = sqlite3.connect(f"file:{sys.argv[1]}?mode=ro", uri=True)
            database.row_factory = sqlite3.Row
            try:
                rows = database.execute("""
                  SELECT ledger.created_at, ledger.status, ledger.operation_type, ledger.model,
                    ledger.model_calls, ledger.input_tokens, ledger.cached_input_tokens,
                    ledger.output_tokens, ledger.total_tokens, ledger.net_micro_usd,
                    ledger.gross_micro_usd, ledger.error_code,
                    CASE WHEN ledger.usage_json IS NULL THEN 0 ELSE 1 END AS has_usage_json,
                    CASE WHEN ledger.pricing_snapshot_json IS NULL THEN 0 ELSE 1 END AS has_pricing,
                    CASE WHEN ledger.user_id IS NULL THEN 'guest' ELSE 'user' END AS identity_kind
                  FROM ono_cost_ledger AS ledger
                  ORDER BY ledger.created_at DESC
                  LIMIT 30
                """).fetchall()
                print("RECENT_ONO_FINANCE_BEGIN")
                for row in rows:
                    print("|".join(f"{key}={row[key]}" for key in row.keys()))
                print("RECENT_ONO_FINANCE_END")
                summary = database.execute("""
                  SELECT status,
                    CASE WHEN user_id IS NULL THEN 'guest' ELSE 'user' END AS identity_kind,
                    COUNT(*) AS operations,
                    SUM(CASE WHEN net_micro_usd IS NULL THEN 1 ELSE 0 END) AS missing_cost,
                    SUM(CASE WHEN net_micro_usd = 0 THEN 1 ELSE 0 END) AS zero_cost,
                    SUM(CASE WHEN model_calls > 0 AND COALESCE(total_tokens, 0) = 0 THEN 1 ELSE 0 END) AS calls_without_tokens
                  FROM ono_cost_ledger
                  GROUP BY status, identity_kind
                  ORDER BY status, identity_kind
                """).fetchall()
                print("ONO_FINANCE_SUMMARY_BEGIN")
                for row in summary:
                    print("|".join(f"{key}={row[key]}" for key in row.keys()))
                print("ONO_FINANCE_SUMMARY_END")
            finally:
                database.close()
            PY
            echo "PRODUCTION_MODIFIED=no"
