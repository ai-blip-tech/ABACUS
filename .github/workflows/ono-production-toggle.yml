name: Toggle Ono 2.0 on Room Design production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Desired server state"
        required: true
        type: choice
        options:
          - enable
          - disable
      confirmation:
        description: "Type ENABLE_ONO_2_PRODUCTION or DISABLE_ONO_2_PRODUCTION"
        required: true
        type: string
      expected_production_sha:
        description: "Full SHA that must be running in production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: roomdesign-production
  cancel-in-progress: false

jobs:
  toggle:
    name: Toggle the Ono server kill switch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backup
    steps:
      - name: Validate manual confirmation
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = "enable" ]; then
            test "$CONFIRMATION" = "ENABLE_ONO_2_PRODUCTION"
          else
            test "$CONFIRMATION" = "DISABLE_ONO_2_PRODUCTION"
          fi

      - name: Change only the Ono server kill switch
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          TOGGLE_ACTION: ${{ inputs.action }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          TOGGLE_RUN_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          envs: TOGGLE_ACTION,EXPECTED_PRODUCTION_SHA,TOGGLE_RUN_ID
          script: |
            set -eu
            umask 077
            cd "$HOME/ABACUS"

            live_dir="$(pwd)"
            env_file="$live_dir/.env"
            data_dir="$live_dir/data"
            report_root="$HOME/room-design-env-backups"
            mkdir -p "$report_root"
            backup_env="$report_root/env-before-ono-toggle-${TOGGLE_RUN_ID}"
            report="$report_root/ono-toggle-${TOGGLE_RUN_ID}.txt"
            changed="no"

            finish() {
              result=$?
              trap - EXIT INT TERM
              if [ "$result" -ne 0 ] && [ "$changed" = "yes" ] && [ -f "$backup_env" ]; then
                cp "$backup_env" "$env_file"
                pm2 restart roomdesign --update-env || true
                curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null || true
              fi
              {
                echo "status=$([ "$result" -eq 0 ] && echo PASSED || echo FAILED)"
                echo "action=$TOGGLE_ACTION"
                echo "production_sha=$(git rev-parse HEAD)"
                echo "expected_production_sha=$EXPECTED_PRODUCTION_SHA"
                echo "data_directory=$data_dir"
                echo "environment_backup=$backup_env"
                echo "database_modified=no"
              } > "$report"
              echo "ONO_TOGGLE_REPORT=$report"
              echo "ONO_ENV_BACKUP=$backup_env"
              echo "ONO_SERVER_STATE=$([ "$TOGGLE_ACTION" = enable ] && echo enabled || echo disabled)"
              exit "$result"
            }
            trap finish EXIT INT TERM

            test -f "$env_file"
            test -d "$data_dir"
            test -f "$data_dir/room-design.sqlite"
            test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCTION_SHA"
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null
            grep -qx "ROOM_DESIGN_DATA_DIR=$data_dir" "$env_file"
            grep -qx 'OPENAI_TEXT_MODEL=gpt-6.1-sol' "$env_file"
            grep -qx 'NEXT_PUBLIC_ONO_V2_ENABLED=true' "$env_file"
            cp "$env_file" "$backup_env"
            chmod 600 "$backup_env"

            target_value=false
            if [ "$TOGGLE_ACTION" = "enable" ]; then target_value=true; fi
            python3 - "$env_file" "$target_value" <<'PY'
            from pathlib import Path
            import sys

            path = Path(sys.argv[1])
            value = sys.argv[2]
            lines = path.read_text(encoding="utf-8").splitlines()
            output = []
            written = False
            for line in lines:
                if line.split("=", 1)[0].strip() == "ONO_V2_ENABLED":
                    if not written:
                        output.append(f"ONO_V2_ENABLED={value}")
                        written = True
                else:
                    output.append(line)
            if not written:
                output.append(f"ONO_V2_ENABLED={value}")
            path.write_text("\n".join(output) + "\n", encoding="utf-8")
            PY
            chmod 600 "$env_file"
            grep -qx "ONO_V2_ENABLED=$target_value" "$env_file"
            changed=yes

            pm2 restart roomdesign --update-env
            curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/account >/dev/null
            if [ "$TOGGLE_ACTION" = "enable" ]; then
              curl --fail --silent --show-error http://127.0.0.1:3000/api/it/config | grep -q '"enabled":true'
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/it)" = "200"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/it/transcribe)" != "503"
            else
              curl --fail --silent --show-error http://127.0.0.1:3000/api/it/config | grep -q '"enabled":false'
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/it)" = "503"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/it/transcribe)" = "503"
            fi
            changed=no
