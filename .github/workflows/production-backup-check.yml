name: Read-only measured-plan request diagnostics
on:
  workflow_dispatch:
    inputs:
      confirmation:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: roomdesign-production
  cancel-in-progress: false
jobs:
  diagnose:
    if: ${{ inputs.confirmation == 'READ_ONLY_MEASURE_ANALYSIS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-backup
    steps:
      - name: Read current recognition states without changing production
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 4m
          script: |
            python3 - <<'PYREMOTE'
            import os,sqlite3,json,urllib.request,urllib.error,subprocess
            from pathlib import Path
            root=Path.home()/'ABACUS';env={}
            for l in (root/'.env').read_text().splitlines():
             if '=' in l and not l.lstrip().startswith('#'):
              k,v=l.split('=',1);env[k.strip()]=v.strip().strip('"').strip("'")
            print('PRODUCTION_SHA',subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip())
            data=Path(env.get('ROOM_DESIGN_DATA_DIR',str(root/'data')));c=sqlite3.connect('file:'+str(data/'room-design.sqlite')+'?mode=ro',uri=True)
            rows=c.execute("select id,kind,created_at from ai_jobs where kind like 'measure:%' order by created_at desc limit 5").fetchall()
            for job,kind,created in rows:
             pid=kind.split(':')[1];saved=c.execute('select revision,updated_at from measured_plans where project_id=?',(pid,)).fetchone();print('JOB',json.dumps({'id':job,'kind':kind,'created':created,'saved':saved}))
             try:
              r=urllib.request.urlopen(urllib.request.Request('https://api.openai.com/v1/responses/'+job,headers={'Authorization':'Bearer '+env['OPENAI_API_KEY']}),timeout=25);d=json.load(r);print('PROVIDER',json.dumps({'status':d.get('status'),'model':d.get('model'),'error':d.get('error'),'incomplete_details':d.get('incomplete_details'),'output_count':len(d.get('output',[]))},ensure_ascii=False))
             except urllib.error.HTTPError as e:print('PROVIDER_HTTP',e.code)
             except Exception as e:print('PROVIDER_CONNECTION',type(e).__name__)
            PYREMOTE
