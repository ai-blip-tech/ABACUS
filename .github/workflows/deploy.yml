name: Read Material Runtime Diagnostic

on:
  workflow_dispatch:

jobs:
  read-diagnostic:
    runs-on: ubuntu-latest

    steps:
      - name: Read safe Material routing diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            cd ~/ABACUS
            echo "PRODUCTION_SHA=$(git rev-parse HEAD)"
            pm2 describe roomdesign | grep -E 'status|exec cwd|created at'
            pm2 logs roomdesign --lines 500 --nostream 2>&1 | grep '\[generate-runtime-diagnostic\]' | tail -n 20
