name: Deploy Room Design

on:
  push:
    branches:
      - main

concurrency:
  group: roomdesign-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build candidate and deploy atomically
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 18m
          script: |
            set -eu
            cd ~/ABACUS

            live_dir="$(pwd)"
            previous_sha="$(git rev-parse HEAD)"
            env_file="$live_dir/.env"
            env_backup=""
            echo "PRODUCTION_SHA_BEFORE=${previous_sha}"
            pm2 describe roomdesign
            curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null

            git status --short
            test -z "$(git status --porcelain -- . ':(exclude)package-lock.json' ':(exclude)next-env.d.ts' ':(exclude).next.rollback-*' ':(exclude).next.failed-*' ':(exclude)roomdesign')"
            git restore --source=HEAD -- package-lock.json next-env.d.ts
            git fetch origin main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

            release_sha="$(git rev-parse HEAD)"
            release_dir="../ABACUS-release-${release_sha}-$(date +%Y%m%d%H%M%S)"
            rollback_dir=""
            candidate_pid=""
            echo "PRODUCTION_SHA_CANDIDATE=${release_sha}"
            test ! -e "$release_dir"
            mkdir "$release_dir"

            cleanup_candidate() {
              if [ -n "$candidate_pid" ]; then
                kill "$candidate_pid" 2>/dev/null || true
                wait "$candidate_pid" 2>/dev/null || true
                candidate_pid=""
              fi
            }

            rollback_release() {
              result=$?
              trap - ERR INT TERM
              cleanup_candidate
              cd "$live_dir"
              if [ -n "$env_backup" ] && [ -f "$env_backup" ]; then
                cp "$env_backup" "$env_file"
                echo "PRODUCTION_ENV_RESTORED=${env_backup}"
              fi
              if [ -n "$rollback_dir" ] && [ -d "$rollback_dir" ]; then
                if [ -d .next ]; then
                  failed_dir=".next.failed-${release_sha}-$(date +%Y%m%d%H%M%S)"
                  mv .next "$failed_dir"
                  echo "FAILED_CANDIDATE_PRESERVED=${failed_dir}"
                fi
                mv "$rollback_dir" .next
                pm2 restart roomdesign --update-env
                curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null || true
              fi
              exit "$result"
            }
            trap rollback_release ERR INT TERM

            test -f "$env_file"
            data_dir="$live_dir/data"
            test -d "$data_dir"
            test -f "$data_dir/room-design.sqlite"
            test "$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$data_dir")" = "$data_dir"
            env_backup_root="$HOME/room-design-env-backups"
            mkdir -p "$env_backup_root"
            env_backup="$env_backup_root/env-pre-ono-${previous_sha}-$(date +%Y%m%d%H%M%S)"
            cp "$env_file" "$env_backup"
            chmod 600 "$env_backup"
            python3 - "$env_file" "$data_dir" <<'PY'
            from pathlib import Path
            import sys

            path = Path(sys.argv[1])
            updates = {
                "ROOM_DESIGN_DATA_DIR": sys.argv[2],
                "OPENAI_TEXT_MODEL": "gpt-6.1-sol",
                "NEXT_PUBLIC_ONO_V2_ENABLED": "true",
                "ONO_V2_ENABLED": "false",
            }
            lines = path.read_text(encoding="utf-8").splitlines()
            output = []
            seen = set()
            for line in lines:
                key = line.split("=", 1)[0].strip() if "=" in line else ""
                if key in updates:
                    if key not in seen:
                        output.append(f"{key}={updates[key]}")
                        seen.add(key)
                else:
                    output.append(line)
            for key, value in updates.items():
                if key not in seen:
                    output.append(f"{key}={value}")
            path.write_text("\n".join(output) + "\n", encoding="utf-8")
            PY
            chmod 600 "$env_file"
            grep -qx "ROOM_DESIGN_DATA_DIR=$data_dir" "$env_file"
            grep -qx 'OPENAI_TEXT_MODEL=gpt-6.1-sol' "$env_file"
            grep -qx 'NEXT_PUBLIC_ONO_V2_ENABLED=true' "$env_file"
            grep -qx 'ONO_V2_ENABLED=false' "$env_file"
            echo "ONO_RELEASE_ENVIRONMENT=prepared-disabled"

            git archive HEAD | tar -x -C "$release_dir"
            cp "$env_file" "$release_dir/.env"

            cd "$release_dir"
            npm ci
            echo "RESOURCE_SNAPSHOT_BEFORE_BUILD"
            free -h || true
            df -h . || true
            timeout --signal=TERM --kill-after=30s 12m npm run build -- --webpack
            test -f .next/BUILD_ID

            candidate_port=3901
            PORT="$candidate_port" ./node_modules/.bin/next start >candidate.log 2>&1 &
            candidate_pid=$!
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused "http://127.0.0.1:${candidate_port}/api/health" >/dev/null
            curl --fail --silent --show-error "http://127.0.0.1:${candidate_port}/" >/dev/null
            curl --fail --silent --show-error "http://127.0.0.1:${candidate_port}/account" >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${candidate_port}/api/it")" = "503"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST "http://127.0.0.1:${candidate_port}/api/it/transcribe")" = "503"
            curl --fail --silent --show-error "http://127.0.0.1:${candidate_port}/api/it/config" | grep -q '"enabled":false'
            cleanup_candidate

            cd "$live_dir"
            candidate_dir=".next.candidate-${release_sha}"
            test ! -e "$candidate_dir"
            mv "$release_dir/.next" "$candidate_dir"
            rollback_dir=".next.rollback-${previous_sha}-$(date +%Y%m%d%H%M%S)"
            test ! -e "$rollback_dir"
            mv .next "$rollback_dir"
            mv "$candidate_dir" .next

            pm2 restart roomdesign --update-env
            curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/account >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/it)" = "503"
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:3000/api/it/transcribe)" = "503"
            curl --fail --silent --show-error http://127.0.0.1:3000/api/it/config | grep -q '"enabled":false'

            production_html="$(curl --fail --silent --show-error http://127.0.0.1:3000/)"
            production_css="$(printf '%s' "$production_html" | grep -oE '/_next/static/[^\" ]+\.css' | sort -u | while IFS= read -r asset; do curl --fail --silent --show-error "http://127.0.0.1:3000${asset}"; done)"
            printf '%s' "$production_css" | grep -q '\.material-tool'
            printf '%s' "$production_css" | grep -q '\.material-brush-trigger'

            trap - ERR INT TERM
            echo "ROLLBACK_BUILD=${rollback_dir}"
            echo "ROLLBACK_ENV=${env_backup}"
            echo "ONO_SERVER_STATE=disabled"
            echo "PRODUCTION_SHA_AFTER=$(git rev-parse HEAD)"
            pm2 describe roomdesign
