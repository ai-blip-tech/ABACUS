name: Roll back Room Design production

on:
  push:
    branches:
      - main

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Restore last working production build
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            cd ~/ABACUS

            rollback_sha="54e3418cb399593140b646dd6a13765cd6ff0353"
            recovery_dir=""
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null; then
              echo "EXISTING_WORKING_BUILD_REUSED=YES"
            else
              recovery_dir="$(ls -1dt .next.rollback-* 2>/dev/null | head -n 1 || true)"
              test -n "$recovery_dir"
              test -d "$recovery_dir"
              echo "FALLBACK_ROLLBACK_BUILD=${recovery_dir}"
            fi

            git status --short
            git restore --source=HEAD -- package-lock.json next-env.d.ts
            git fetch origin main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
            echo "PRODUCTION_CHECKOUT_SHA=$(git rev-parse HEAD)"

            pkill -f '[n]ext build' || true
            pm2 stop roomdesign || true

            if [ -n "$recovery_dir" ]; then
              if [ -d .next ]; then
                failed_dir=".next.failed-$(date +%Y%m%d%H%M%S)"
                mv .next "$failed_dir"
                echo "INTERRUPTED_BUILD_PRESERVED=${failed_dir}"
              fi
              cp -a "$recovery_dir" .next
            fi

            pm2 restart roomdesign --update-env

            curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/account >/dev/null

            echo "RUNTIME_BUILD_ROLLBACK_SHA=${rollback_sha}"
            pm2 describe roomdesign
