name: Deploy Room Design

on:
  push:
    branches:
      - main

concurrency:
  group: roomdesign-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Build candidate and deploy atomically
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 18m
          script: |
            set -eu
            cd ~/ABACUS

            live_dir="$(pwd)"
            previous_sha="$(git rev-parse HEAD)"
            env_file="$live_dir/.env"
            env_backup=""
            echo "PRODUCTION_SHA_BEFORE=${previous_sha}"
            pm2 describe roomdesign
            curl --fail --silent --show-error http://127.0.0.1:3000/api/health >/dev/null

            # Fail closed unless a fresh, verified backup matches the running code.
            python3 - "$HOME/room-design-backups" "$previous_sha" <<'PY'
            from pathlib import Path
            import sys, time
            reports = sorted(Path(sys.argv[1]).glob("predeploy-*/REPORT.txt"), key=lambda p:p.stat().st_mtime, reverse=True)
            if not reports:
                raise SystemExit("Missing verified production backup")
            report = reports[0]
            fields = dict(line.split("=",1) for line in report.read_text().splitlines() if "=" in line)
            if fields.get("status") != "PASSED" or fields.get("production_sha") != sys.argv[2] or time.time()-report.stat().st_mtime > 3600:
                raise SystemExit("Backup is failed, stale, or belongs to a different production version")
            print("FRESH_BACKUP_GATE=PASSED")
            PY
            command -v pdfinfo >/dev/null
            command -v pdftoppm >/dev/null

            # Free build space before Git needs to create any lock or temporary
            # files. The active .next, application data and verified backups are
            # deliberately outside this disposable-artifact allowlist.
            python3 - "$live_dir" <<'PY'
            from pathlib import Path
            import shutil
            import sys

            live = Path(sys.argv[1]).resolve()
            parent = live.parent

            def remove(target: Path, expected_parent: Path) -> None:
                resolved = target.resolve()
                if resolved.parent != expected_parent or not resolved.is_dir():
                    raise SystemExit(f"Refusing unsafe build cleanup target: {resolved}")
                shutil.rmtree(resolved)
                print(f"REMOVED_OLD_BUILD={resolved.name}")

            stale_lock = live / ".git" / "index.lock"
            if stale_lock.is_file():
                stale_lock.unlink()
                print("REMOVED_STALE_GIT_LOCK=index.lock")

            rollbacks = sorted(
                (path for path in live.glob(".next.rollback-*") if path.is_dir()),
                key=lambda path: path.stat().st_mtime,
                reverse=True,
            )
            for path in rollbacks[2:]:
                remove(path, live)

            for pattern in (".next.failed-*", ".next.candidate-*"):
                for path in live.glob(pattern):
                    if path.is_dir():
                        remove(path, live)

            for path in parent.glob("ABACUS-release-*"):
                if path.is_dir():
                    remove(path, parent)
            PY
            echo "RESOURCE_SNAPSHOT_AFTER_EARLY_BUILD_ROTATION"
            df -h . || true

            git status --short
            test -z "$(git status --porcelain -- . ':(exclude)package-lock.json' ':(exclude)next-env.d.ts' ':(exclude).next.rollback-*' ':(exclude).next.failed-*' ':(exclude)roomdesign')"
            git restore --source=HEAD -- package-lock.json next-env.d.ts
            git fetch origin main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

            # The live .next directory and verified production backups are never
            # touched here. Rotate only disposable build artifacts left by old
            # or interrupted deployments, keeping the two newest rollback builds.
            python3 - "$live_dir" <<'PY'
            from pathlib import Path
            import shutil
            import sys

            live = Path(sys.argv[1]).resolve()
            parent = live.parent

            def remove(target: Path, expected_parent: Path) -> None:
                resolved = target.resolve()
                if resolved.parent != expected_parent or not resolved.is_dir():
                    raise SystemExit(f"Refusing unsafe build cleanup target: {resolved}")
                shutil.rmtree(resolved)
                print(f"REMOVED_OLD_BUILD={resolved.name}")

            rollbacks = sorted(
                (path for path in live.glob(".next.rollback-*") if path.is_dir()),
                key=lambda path: path.stat().st_mtime,
                reverse=True,
            )
            for path in rollbacks[2:]:
                remove(path, live)

            for pattern in (".next.failed-*", ".next.candidate-*"):
                for path in live.glob(pattern):
                    if path.is_dir():
                        remove(path, live)

            for path in parent.glob("ABACUS-release-*"):
                if path.is_dir():
                    remove(path, parent)
            PY
            echo "RESOURCE_SNAPSHOT_AFTER_BUILD_ROTATION"
            df -h . || true

            release_sha="$(git rev-parse HEAD)"
            release_dir="../ABACUS-release-${release_sha}-$(date +%Y%m%d%H%M%S)"
            rollback_dir=""
            candidate_pid=""
            echo "PRODUCTION_SHA_CANDIDATE=${release_sha}"
            test ! -e "$release_dir"
            mkdir "$release_dir"

            cleanup_candidate() {
              if [ -n "$candidate_pid" ]; then
                kill "$candidate_pid" 2>/dev/null || true
                wait "$candidate_pid" 2>/dev/null || true
                candidate_pid=""
              fi
            }

            cleanup_release_dir() {
              python3 - "$live_dir" "$release_dir" <<'PY'
            from pathlib import Path
            import shutil
            import sys

            live = Path(sys.argv[1]).resolve()
            target = (live / sys.argv[2]).resolve()
            if target.parent != live.parent or not target.name.startswith("ABACUS-release-"):
                raise SystemExit(f"Refusing unsafe release cleanup target: {target}")
            if target.is_dir():
                shutil.rmtree(target)
                print(f"REMOVED_RELEASE_BUILD={target.name}")
            PY
            }

            rollback_release() {
              result=$?
              trap - ERR INT TERM
              cleanup_candidate
              cd "$live_dir"
              if [ -n "$env_backup" ] && [ -f "$env_backup" ]; then
                cp "$env_backup" "$env_file"
                echo "PRODUCTION_ENV_RESTORED=${env_backup}"
              fi
              if [ -n "$rollback_dir" ] && [ -d "$rollback_dir" ]; then
                if [ -d .next ]; then
                  failed_dir=".next.failed-${release_sha}-$(date +%Y%m%d%H%M%S)"
                  mv .next "$failed_dir"
                  echo "FAILED_CANDIDATE_PRESERVED=${failed_dir}"
                fi
                mv "$rollback_dir" .next
                pm2 restart roomdesign --update-env
                curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null || true
              fi
              cleanup_release_dir
              git reset --keep "$previous_sha"
              echo "PRODUCTION_SOURCE_ROLLED_BACK=$previous_sha"
              exit "$result"
            }
            trap rollback_release ERR INT TERM

            test -f "$env_file"
            data_dir="$live_dir/data"
            test -d "$data_dir"
            test -f "$data_dir/room-design.sqlite"
            test "$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$data_dir")" = "$data_dir"
            env_backup_root="$HOME/room-design-env-backups"
            mkdir -p "$env_backup_root"
            env_backup="$env_backup_root/env-pre-ono-${previous_sha}-$(date +%Y%m%d%H%M%S)"
            cp "$env_file" "$env_backup"
            chmod 600 "$env_backup"
            python3 - "$env_file" "$data_dir" <<'PY'
            from pathlib import Path
            import sys

            path = Path(sys.argv[1])
            updates = {
                "ROOM_DESIGN_DATA_DIR": sys.argv[2],
                "OPENAI_TEXT_MODEL": "gpt-6.1-sol",
                "NEXT_PUBLIC_ONO_V2_ENABLED": "true",
                "ONO_V2_ENABLED": "true",
            }
            lines = path.read_text(encoding="utf-8").splitlines()
            output = []
            seen = set()
            for line in lines:
                key = line.split("=", 1)[0].strip() if "=" in line else ""
                if key in updates:
                    if key not in seen:
                        output.append(f"{key}={updates[key]}")
                        seen.add(key)
                else:
                    output.append(line)
            for key, value in updates.items():
                if key not in seen:
                    output.append(f"{key}={value}")
            path.write_text("\n".join(output) + "\n", encoding="utf-8")
            PY
            chmod 600 "$env_file"
            grep -qx "ROOM_DESIGN_DATA_DIR=$data_dir" "$env_file"
            grep -qx 'OPENAI_TEXT_MODEL=gpt-6.1-sol' "$env_file"
            grep -qx 'NEXT_PUBLIC_ONO_V2_ENABLED=true' "$env_file"
            grep -qx 'ONO_V2_ENABLED=true' "$env_file"
            echo "ONO_RELEASE_ENVIRONMENT=prepared-enabled"

            git archive HEAD | tar -x -C "$release_dir"
            cp "$env_file" "$release_dir/.env"

            cd "$release_dir"
            npm ci
            ROOM_DESIGN_DATA_DIR="$(pwd)/isolated-unit-data" npm run test:unit
            echo "RESOURCE_SNAPSHOT_BEFORE_BUILD"
            free -h || true
            df -h . || true
            timeout --signal=TERM --kill-after=30s 12m npm run build -- --webpack
            test -f .next/BUILD_ID

            candidate_port=3901
            ROOM_DESIGN_DATA_DIR="$(pwd)/isolated-smoke-data" PORT="$candidate_port" ./node_modules/.bin/next start >candidate.log 2>&1 &
            candidate_pid=$!
            curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused "http://127.0.0.1:${candidate_port}/api/health" >/dev/null
            curl --fail --silent --show-error "http://127.0.0.1:${candidate_port}/" >/dev/null
            curl --fail --silent --show-error "http://127.0.0.1:${candidate_port}/account" >/dev/null
            curl --fail --silent --show-error "http://127.0.0.1:${candidate_port}/api/it/config" | grep -q '"enabled":true'
            MEASURE_SMOKE_BASE="http://127.0.0.1:${candidate_port}" node --no-experimental-strip-types --import ./scripts/register-test-typescript.mjs scripts/measured-plan-local-smoke.mjs
            cleanup_candidate

            cd "$live_dir"
            candidate_dir=".next.candidate-${release_sha}"
            test ! -e "$candidate_dir"
            mv "$release_dir/.next" "$candidate_dir"
            cleanup_release_dir
            rollback_dir=".next.rollback-${previous_sha}-$(date +%Y%m%d%H%M%S)"
            test ! -e "$rollback_dir"
            mv .next "$rollback_dir"
            mv "$candidate_dir" .next

            pm2 restart roomdesign --update-env
            curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/account >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/measured-plan >/dev/null
            test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/projects/release-auth-check/measured-plan)" = "401"
            curl --fail --silent --show-error http://127.0.0.1:3000/api/it/config | grep -q '"enabled":true'

            production_html="$(curl --fail --silent --show-error http://127.0.0.1:3000/)"
            production_css="$(printf '%s' "$production_html" | grep -oE '/_next/static/[^\" ]+\.css' | sort -u | while IFS= read -r asset; do curl --fail --silent --show-error "http://127.0.0.1:3000${asset}"; done)"
            printf '%s' "$production_css" | grep -q '\.material-tool'
            printf '%s' "$production_css" | grep -q '\.material-brush-trigger'

            trap - ERR INT TERM
            echo "ROLLBACK_BUILD=${rollback_dir}"
            echo "ROLLBACK_ENV=${env_backup}"
            echo "ONO_SERVER_STATE=enabled"
            echo "PRODUCTION_SHA_AFTER=$(git rev-parse HEAD)"
            pm2 describe roomdesign
