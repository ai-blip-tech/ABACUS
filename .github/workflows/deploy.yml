name: Deploy Room Design

on:
  push:
    branches:
      - codex/production-rollback-133faa6

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Amsterdam VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            cd ~/ABACUS

            rollback_sha="133faa6cd8f17a6c93f54da8ea8ae61830ac244d"
            expected_current_sha="fe4ae21321fb97d04b5361284bf5308d31846fa3"
            current_sha="$(git rev-parse HEAD)"
            current_branch="$(git branch --show-current)"

            echo "PRODUCTION_SHA_BEFORE=$(git rev-parse HEAD)"
            echo "PRODUCTION_BRANCH_BEFORE=${current_branch:-detached}"
            pm2 describe roomdesign

            test "$current_sha" = "$expected_current_sha"
            git status --short
            git diff --stat -- package-lock.json
            if [ -e roomdesign ]; then
              ls -ld roomdesign
              file roomdesign
            fi
            test -z "$(git status --porcelain)"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$expected_current_sha"
            git cat-file -e "${rollback_sha}^{commit}"
            git switch -C production-rollback "$rollback_sha"
            echo "PRODUCTION_SHA_BUILD=$(git rev-parse HEAD)"

            pm2_stopped=0
            build_backup_ready=0
            rollback_build() {
              result=$?
              trap - ERR
              if [ -n "$current_branch" ]; then
                git switch "$current_branch"
                test "$(git rev-parse HEAD)" = "$current_sha"
              else
                git switch --detach "$current_sha"
              fi
              if [ "$build_backup_ready" = "1" ]; then
                rm -rf .next
                mv .next.rollback .next
              fi
              if [ "$pm2_stopped" = "1" ]; then
                pm2 restart roomdesign --update-env
              fi
              exit "$result"
            }
            trap rollback_build ERR

            npm install

            test ! -e .next.rollback
            test -d .next
            pm2 stop roomdesign
            pm2_stopped=1
            mv .next .next.rollback
            build_backup_ready=1

            npm run build
            pm2 restart roomdesign --update-env

            curl --fail --silent --show-error --retry 12 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/api/health >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
            curl --fail --silent --show-error http://127.0.0.1:3000/account >/dev/null

            test "$(git rev-parse HEAD)" = "$rollback_sha"

            production_html="$(curl --fail --silent --show-error http://127.0.0.1:3000/)"
            production_css="$(printf '%s' "$production_html" | grep -oE '/_next/static/[^\" ]+\.css' | sort -u | while IFS= read -r asset; do curl --fail --silent --show-error "http://127.0.0.1:3000${asset}"; done)"
            printf '%s' "$production_css" | grep -q '\.material-tool'
            printf '%s' "$production_css" | grep -q '\.material-brush-trigger'

            trap - ERR
            rm -rf .next.rollback

            echo "PRODUCTION_SHA_AFTER=$(git rev-parse HEAD)"
            pm2 describe roomdesign
